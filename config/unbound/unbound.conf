# ============================================================
# VantaDNS — Unbound Configuration
# Role: Local caching recursive resolver (loopback only)
# Listens on: 127.0.0.1:5335
# ============================================================

server:
    # --------------------------------------------------------
    # Network binding — loopback ONLY
    # Never accept queries from external interfaces
    # --------------------------------------------------------
    interface: 127.0.0.1
    port: 5335

    # Do not auto-detect interfaces — bind explicitly
    do-not-query-localhost: no

    # --------------------------------------------------------
    # Access control — refuse everything, allow loopback
    # This is defense-in-depth; firewall also enforces this
    # --------------------------------------------------------
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.1/32 allow

    # --------------------------------------------------------
    # Protocol support
    # --------------------------------------------------------
    do-ip4: yes
    do-ip6: no          # Disable IPv6 until needed; simplifies initial setup
    do-udp: yes
    do-tcp: yes

    # --------------------------------------------------------
    # Root hints
    # The root.hints file tells Unbound where the root servers are.
    # Downloaded at install time from https://www.internic.net/domain/named.root
    # Fetched by scripts/install.ps1, excluded from git via .gitignore
    # --------------------------------------------------------
    root-hints: "C:\\ProgramData\\VantaDNS\\unbound\\root.hints"

    # --------------------------------------------------------
    # DNSSEC validation
    # auto-trust-anchor-file: Unbound automatically maintains the root KSK.
    # The anchor file is created/updated by unbound-anchor.exe
    # --------------------------------------------------------
    auto-trust-anchor-file: "C:\\ProgramData\\VantaDNS\\unbound\\root.key"

    # Serve DNSSEC chain of trust data to clients (AGH will pass it through)
    val-clean-additional: yes

    # --------------------------------------------------------
    # QNAME minimisation (RFC 7816)
    # Limits how much of the queried name is sent to intermediate
    # nameservers, reducing leakage.
    # --------------------------------------------------------
    qname-minimisation: yes
    qname-minimisation-strict: no   # Fallback to full name if minimised fails

    # --------------------------------------------------------
    # Caching configuration
    # --------------------------------------------------------
    # Prefetch popular records before they expire (warm cache)
    prefetch: yes
    prefetch-key: yes

    # Cache size limits (bounded to prevent unbounded RAM usage)
    msg-cache-size: 64m
    rrset-cache-size: 128m

    # Minimum TTL for cached records (override DNS TTLs that are too short)
    cache-min-ttl: 300

    # Maximum TTL for cached records (prevent stale data from persisting too long)
    cache-max-ttl: 86400

    # Negative caching (NXDOMAIN responses)
    cache-max-negative-ttl: 3600

    # --------------------------------------------------------
    # Privacy hardening
    # --------------------------------------------------------
    # Do not publish server version (avoid fingerprinting)
    hide-version: yes
    hide-identity: yes

    # Harden against NSEC enumeration
    harden-dnssec-stripped: yes

    # Reject queries for private address ranges (RFC 1918) — prevents
    # attackers from using Unbound to probe internal networks
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # --------------------------------------------------------
    # Hardening
    # --------------------------------------------------------
    harden-glue: yes
    harden-referral-path: no    # Can cause false negatives for some domains
    harden-algo-downgrade: yes  # Reject algorithm downgrade attacks
    harden-short-bufsize: yes
    harden-large-queries: yes

    # Require DO bit in queries (DNSSEC-aware resolver behavior)
    harden-below-nxdomain: yes

    # Use randomized source port (source port randomisation for cache poisoning defense)
    use-syslog: no

    # --------------------------------------------------------
    # Performance
    # --------------------------------------------------------
    num-threads: 1          # Single-threaded for simplicity; increase if needed
    so-reuseport: no        # Windows does not support SO_REUSEPORT
    outgoing-range: 512
    num-queries-per-thread: 1024

    # Aggressive NSEC: use cached NXDOMAIN proofs to answer negative queries
    # without re-querying upstream
    aggressive-nsec: yes

    # --------------------------------------------------------
    # Logging — privacy-first: NO query logging
    # verbosity 0 = errors only; 1 = queries; 2+ = debug
    # --------------------------------------------------------
    verbosity: 0
    use-syslog: no
    logfile: ""

    # Disable statistics dump to disk
    statistics-interval: 0
    statistics-cumulative: no
    extended-statistics: no

    # --------------------------------------------------------
    # Outgoing connections
    # Unbound connects to authoritative servers on the Internet.
    # No upstream forwarder is configured — pure recursive resolution.
    # --------------------------------------------------------
    # (no forward-zone entries — Unbound resolves from root servers directly)

# ============================================================
# Remote control — disabled for security
# Enable only if you need unbound-control for diagnostics
# ============================================================
remote-control:
    control-enable: no
