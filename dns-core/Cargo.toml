[package]
name = "vanta-dns-core"
version = "0.1.0"
edition = "2021"
authors = ["vincenzo-afk <itsmebk2007@gmail.com>"]
description = "VantaDNS — High-performance, privacy-focused custom Rust DNS filtering engine & caching resolver"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
lru = "0.12"
ahash = "0.8"
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }
rcgen = { version = "0.13", optional = true }

[dev-dependencies]
tokio-test = "0.4"
futures = "0.3"
tokio-rustls = "0.26"

[features]
default = ["tls"]
tls = ["dep:tokio-rustls", "dep:rustls-pemfile", "dep:rcgen"]
